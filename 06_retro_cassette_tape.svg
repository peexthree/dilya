<svg id="svg-06" class="w-28 h-28 text-white animate-zzz-pulse" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <style>
                    @keyframes zzzPulse {
                        0%, 100% { filter: drop-shadow(0 0 2px rgba(232,255,0,0.4)); }
                        50% { filter: drop-shadow(0 0 12px rgba(232,255,0,0.85)); }
                    }
                    @keyframes zzzGlitch {
                        0%, 100% { transform: translate(0, 0) skew(0deg); }
                        10% { transform: translate(-1px, 1px) skew(-2deg); }
                        20% { transform: translate(1px, -1px) skew(2deg); }
                        30% { transform: translate(0, 0) skew(0deg); }
                        80% { transform: translate(1px, 1px) skew(1deg); }
                        90% { transform: translate(-1px, -1px) skew(-1deg); }
                    }
                    @keyframes zzzSpin {
                        from { transform: rotate(0deg); }
                        to { transform: rotate(360deg); }
                    }
                    @keyframes zzzFloat {
                        0%, 100% { transform: translateY(0); }
                        50% { transform: translateY(-4px); }
                    }
                    @keyframes zzzSpray {
                        0% { transform: scale(0.6) translate(0, 0); opacity: 0; }
                        50% { transform: scale(1.1) translate(-6px, -6px); opacity: 0.8; }
                        100% { transform: scale(1.3) translate(-12px, -12px); opacity: 0; }
                    }
                    @keyframes zzzBeat {
                        0%, 100% { transform: scale(1); }
                        30% { transform: scale(1.15); }
                        60% { transform: scale(0.95); }
                    }
                    @keyframes zzzWave {
                        0%, 100% { transform: scaleY(0.4); }
                        50% { transform: scaleY(1.1); }
                    }
                    .animate-zzz-pulse { animation: zzzPulse 2s infinite ease-in-out; }
                    .animate-zzz-glitch { animation: zzzGlitch 1.5s infinite steps(2); }
                    .animate-zzz-spin { transform-origin: 50% 50%; animation: zzzSpin 12s infinite linear; }
                    .animate-zzz-spin-fast { transform-origin: 50% 50%; animation: zzzSpin 3s infinite linear; }
                    .animate-zzz-float { animation: zzzFloat 3s infinite ease-in-out; }
                    .animate-zzz-spray { transform-origin: 30% 30%; animation: zzzSpray 1.8s infinite ease-out; }
                    .animate-zzz-beat { transform-origin: 50% 50%; animation: zzzBeat 1.2s infinite cubic-bezier(0.25, 0.8, 0.25, 1); }
                    .animate-wave-1 { transform-origin: bottom; animation: zzzWave 0.6s infinite ease-in-out alternate; }
                    .animate-wave-2 { transform-origin: bottom; animation: zzzWave 0.8s infinite ease-in-out alternate; }
                    .animate-wave-3 { transform-origin: bottom; animation: zzzWave 0.5s infinite ease-in-out alternate; }
                </style>

                            <!-- Main cassette shell -->
                            <rect x="15" y="25" width="70" height="48" rx="6" fill="#141419" stroke="#E8FF00" stroke-width="4.5"></rect>
                            <!-- Bottom tape protector block -->
                            <path d="M26 73 L32 64 H68 L74 73 Z" fill="#27272a" stroke="#E8FF00" stroke-width="3.5" stroke-linejoin="round"></path>

                            <!-- Middle sticker/label -->
                            <rect x="23" y="33" width="54" height="22" rx="3" fill="#FF0055"></rect>

                            <!-- Left spinning gear -->
                            <circle cx="38" cy="44" r="8" fill="#121214" stroke="#E8FF00" stroke-width="3"></circle>
                            <!-- Gear teeth inside -->
                            <path d="M38 38 V50 M32 44 H44" stroke="#E8FF00" stroke-width="2.5" class="animate-zzz-spin"></path>

                            <!-- Right spinning gear -->
                            <circle cx="62" cy="44" r="8" fill="#121214" stroke="#E8FF00" stroke-width="3"></circle>
                            <path d="M62 38 V50 M56 44 H68" stroke="#E8FF00" stroke-width="2.5" class="animate-zzz-spin"></path>

                            <!-- Audio equalizer bars inside sticker (creative touch) -->
                            <g class="opacity-90">
                                <rect x="47" y="38" width="2" height="12" fill="#E8FF00" class="animate-wave-1"></rect>
                                <rect x="50" y="38" width="2" height="12" fill="#FFFFFF" class="animate-wave-2"></rect>
                                <rect x="53" y="38" width="2" height="12" fill="#E8FF00" class="animate-wave-3"></rect>
                            </g>

                            <!-- Trailing soundwaves behind cassette -->
                            <path d="M10 35 Q5 35 10 45" stroke="#FF0055" stroke-width="2" stroke-linecap="round" class="animate-zzz-glitch"></path>
                            <path d="M90 35 Q95 35 90 45" stroke="#E8FF00" stroke-width="2" stroke-linecap="round" class="animate-zzz-glitch"></path>
                        </svg>