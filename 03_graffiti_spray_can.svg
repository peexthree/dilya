<svg id="svg-03" class="w-28 h-28 text-white animate-zzz-pulse" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <style>
                    @keyframes zzzPulse {
                        0%, 100% { filter: drop-shadow(0 0 2px rgba(232,255,0,0.4)); }
                        50% { filter: drop-shadow(0 0 12px rgba(232,255,0,0.85)); }
                    }
                    @keyframes zzzGlitch {
                        0%, 100% { transform: translate(0, 0) skew(0deg); }
                        10% { transform: translate(-1px, 1px) skew(-2deg); }
                        20% { transform: translate(1px, -1px) skew(2deg); }
                        30% { transform: translate(0, 0) skew(0deg); }
                        80% { transform: translate(1px, 1px) skew(1deg); }
                        90% { transform: translate(-1px, -1px) skew(-1deg); }
                    }
                    @keyframes zzzSpin {
                        from { transform: rotate(0deg); }
                        to { transform: rotate(360deg); }
                    }
                    @keyframes zzzFloat {
                        0%, 100% { transform: translateY(0); }
                        50% { transform: translateY(-4px); }
                    }
                    @keyframes zzzSpray {
                        0% { transform: scale(0.6) translate(0, 0); opacity: 0; }
                        50% { transform: scale(1.1) translate(-6px, -6px); opacity: 0.8; }
                        100% { transform: scale(1.3) translate(-12px, -12px); opacity: 0; }
                    }
                    @keyframes zzzBeat {
                        0%, 100% { transform: scale(1); }
                        30% { transform: scale(1.15); }
                        60% { transform: scale(0.95); }
                    }
                    @keyframes zzzWave {
                        0%, 100% { transform: scaleY(0.4); }
                        50% { transform: scaleY(1.1); }
                    }
                    .animate-zzz-pulse { animation: zzzPulse 2s infinite ease-in-out; }
                    .animate-zzz-glitch { animation: zzzGlitch 1.5s infinite steps(2); }
                    .animate-zzz-spin { transform-origin: 50% 50%; animation: zzzSpin 12s infinite linear; }
                    .animate-zzz-spin-fast { transform-origin: 50% 50%; animation: zzzSpin 3s infinite linear; }
                    .animate-zzz-float { animation: zzzFloat 3s infinite ease-in-out; }
                    .animate-zzz-spray { transform-origin: 30% 30%; animation: zzzSpray 1.8s infinite ease-out; }
                    .animate-zzz-beat { transform-origin: 50% 50%; animation: zzzBeat 1.2s infinite cubic-bezier(0.25, 0.8, 0.25, 1); }
                    .animate-wave-1 { transform-origin: bottom; animation: zzzWave 0.6s infinite ease-in-out alternate; }
                    .animate-wave-2 { transform-origin: bottom; animation: zzzWave 0.8s infinite ease-in-out alternate; }
                    .animate-wave-3 { transform-origin: bottom; animation: zzzWave 0.5s infinite ease-in-out alternate; }
                </style>
            
                            <!-- Spray mist (highly animated) -->
                            <g class="animate-zzz-spray">
                                <circle cx="25" cy="22" r="5" fill="#FF0055"></circle>
                                <circle cx="16" cy="14" r="9" fill="#E8FF00" opacity="0.6"></circle>
                                <circle cx="10" cy="10" r="6" fill="#FFFFFF" opacity="0.8"></circle>
                            </g>

                            <!-- Cap & nozzle -->
                            <rect x="52" y="14" width="12" height="10" rx="2" fill="#27272a" stroke="#E8FF00" stroke-width="3"></rect>
                            <path d="M58 24 L58 30" stroke="#FF0055" stroke-width="4.5"></path>
                            <!-- Spray cap nozzle hole -->
                            <circle cx="52" cy="19" r="2.5" fill="#FF0055"></circle>

                            <!-- Main spray can body -->
                            <rect x="42" y="30" width="32" height="52" rx="6" fill="#141419" stroke="#E8FF00" stroke-width="4.5"></rect>
                            <!-- Bottom ring -->
                            <path d="M42 74 H74" stroke="#E8FF00" stroke-width="4.5"></path>
                            
                            <!-- Slanted graffiti label on can -->
                            <g class="animate-zzz-glitch">
                                <rect x="46" y="42" width="24" height="22" rx="2" fill="#FF0055" transform="rotate(-6 58 53)"></rect>
                                <text x="50" y="56" fill="#000" font-weight="900" font-size="13" font-family="'Outfit'" transform="rotate(-6 58 53)">Z</text>
                                <text x="59" y="58" fill="#FFF" font-weight="900" font-size="11" font-family="'Outfit'" transform="rotate(-6 58 53)">X</text>
                            </g>

                            <!-- Drips coming off can -->
                            <path d="M47 82 V87 C47 89, 45 89, 45 87 Z" stroke="#FF0055" stroke-width="3" stroke-linecap="round"></path>
                        </svg>